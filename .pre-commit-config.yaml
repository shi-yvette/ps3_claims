# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  # black and isort read their settings from pyproject.toml (88 characters).
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  # flake8 reads max-line-length = 88 from setup.cfg.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
  # mypy runs in its own environment, so it needs the stubs listed here.
  # Its options are set in pyproject.toml.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: [numpy, pandas-stubs]
