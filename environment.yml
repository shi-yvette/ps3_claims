name: ps3
channels:
  - conda-forge
  - nodefaults
dependencies:
  # defaults
  - python=3.12
  - pip
  - pre-commit
  - pytest>=6  # Adds --import-mode option
  - pytest-cov
  - setuptools-scm
  # data
  - pandas
  - numpy
  - dask-ml
  - ydata-profiling
  # interactive
  - ipykernel
  # plots
  - matplotlib
  # ml
  - glum
  - lightgbm
  - scikit-learn
  # interpretation
  - plotly
  - nbformat  # plotly needs it to show figures in the interactive window
  - pip:
      # conda-forge only has dalex 1.7.0, whose plots fail with numpy 2
      - dalex>=1.7.1
